[workspace]
members = ["crates/core", "crates/platform", "crates/web"]
default-members = ["crates/web"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/licentiapoetica/mumh5"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
openssl = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
mumh5-core = { path = "crates/core", default-features = false }
mumh5-platform = { path = "crates/platform" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
