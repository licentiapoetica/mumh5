name: Check Dream Cord
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - name: Native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config protobuf-compiler libssl-dev libopus-dev libvpx-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            .tooling
            target
          key: linux-rust-1.100-bun-1.4.5-${{ hashFiles('Cargo.lock', 'frontend/bun.lock') }}
      - name: Isolated tools and frontend dependencies
        run: ./tools/bootstrap.sh
      - name: Build, lint and test
        run: ./tools/check.sh
      - name: Core without video dependencies
        shell: bash
        run: |
          source tools/env.sh
          cargo test --locked -p dream-cord-core --no-default-features
      - name: Native text, voice and video integration
        shell: bash
        run: |
          source tools/env.sh
          docker run -d --name dream-cord-ci -p 127.0.0.1:64750:64738/tcp -p 127.0.0.1:64750:64738/udp -e MUMBLE_CONFIG_AUTOBAN_ATTEMPTS=0 mumblevoip/mumble-server:latest
          trap 'docker rm -f dream-cord-ci' EXIT
          timeout 30 bash -c 'until (echo > /dev/tcp/127.0.0.1/64750) 2>/dev/null; do sleep 0.2; done'
          DREAM_CORD_TEST_HOST=127.0.0.1 DREAM_CORD_TEST_PORT=64750 cargo test --locked -p dream-cord-core --test live_server -- --nocapture
