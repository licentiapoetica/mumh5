name: Build desktop app and Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  headless:
    name: Rust headless client and bot integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mumble:
        image: mumblevoip/mumble-server:latest
        env:
          MUMBLE_CONFIG_AUTOBANATTEMPTS: '0'
          MUMBLE_SUPERUSER_PASSWORD: cli-test-only
        ports:
          - 64749:64738/tcp
          - 64749:64738/udp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-cli -> target
      - name: Install native codec and TLS headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libopus-dev libvpx-dev protobuf-compiler pkg-config
      - run: npm ci
      # The Node SDK is an interoperability test peer, not part of the Rust runtime.
      - run: npm --prefix cli ci
      - run: cargo fmt --manifest-path rust-cli/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust-cli/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path rust-cli/Cargo.toml
      - run: cargo test --locked --manifest-path rust-cli/Cargo.toml --no-default-features
      - run: npm run build:cli
      - run: npm run test:e2e:cli
        env:
          MUMBLE_TEST_HOST: 127.0.0.1:64749
          CLI_TEST_BINARY: ./dist-cli-rust/mumh5-cli
      - run: npm run test:e2e:cli
        env:
          MUMBLE_TEST_HOST: 127.0.0.1:64749
          CLI_TEST_BINARY: ./dist-cli-rust/mumh5-cli
          CLI_TEST_TCP_ONLY: '1'
      - run: node test/e2e/rust-bot.e2e.ts
        env:
          MUMBLE_TEST_HOST: 127.0.0.1:64749
          MUMBLE_SUPERUSER_PASSWORD: cli-test-only
          CLI_TEST_BINARY: ./dist-cli-rust/mumh5-cli

  # Pull requests run checks and headless integration without packaging the app.
  desktop:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package desktop app
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify AppImage uses a static runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for appimage in release/*.AppImage; do
            if readelf --program-headers "$appimage" | grep -q INTERP; then
              echo "AppImage runtime is dynamically linked; use the bundled static FUSE runtime."
              exit 1
            fi
            "$appimage" --appimage-version
          done
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: mumh5-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snapshot:
    name: Publish latest snapshot
    needs: [desktop, docker]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'mumh5-*' --dir snapshot-artifacts
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/publish-snapshot.sh snapshot-artifacts
