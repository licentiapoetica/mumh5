name: Build desktop app and Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      # The browser build can fail on what type checking and the tests accept (a name exported twice)
      - run: npm run build:web

  # The Android shell around the hosted site. Its own packages are in android/, so the other jobs
  # never install them. The APK is debug-signed and opens https://mumble.0x29a.me/ unless the
  # repository variable MUMH5_APP_URL names another site. The latest snapshot release carries it.
  android:
    name: Android app (debug build)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MUMH5_APP_URL: ${{ vars.MUMH5_APP_URL || 'https://mumble.0x29a.me/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        working-directory: android
      - run: npx cap sync android
        working-directory: android
      # Maven Central now and then answers 429 to a runner; a second try nearly always works
      - name: Build the debug APK
        working-directory: android
        run: |
          for attempt in 1 2 3; do
            ./gradlew assembleDebug && exit 0
            echo "Gradle failed (attempt $attempt of 3)" >&2
            sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: mumh5-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # Pull requests only get the type check and tests
  desktop:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.arch }})
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package desktop app
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Verify AppImage uses a static runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          for appimage in release/*.AppImage; do
            if readelf --program-headers "$appimage" | grep -q INTERP; then
              echo "AppImage runtime is dynamically linked; use the bundled static FUSE runtime."
              exit 1
            fi
            "$appimage" --appimage-version
          done
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: mumh5-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker image
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "$image:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snapshot:
    name: Publish latest snapshot
    # The Android build is optional here: if it failed, the snapshot goes out without an APK
    needs: [desktop, docker, android]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.docker.result == 'success' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Download desktop installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --pattern 'mumh5-*' --dir snapshot-artifacts
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SNAPSHOT_SHA: ${{ github.sha }}
          SNAPSHOT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SNAPSHOT_APP_URL: ${{ vars.MUMH5_APP_URL || 'https://mumble.0x29a.me/' }}
        run: bash scripts/publish-snapshot.sh snapshot-artifacts
